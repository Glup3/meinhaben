# Optional local alternative to pnpm run pb:dev. Binds only to localhost.
services:
  pocketbase:
    build:
      context: .
      dockerfile: pocketbase/Dockerfile
    entrypoint: ["/pb/pocketbase"]
    command: ["serve", "--http=0.0.0.0:8090", "--dev"]
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./pocketbase/pb_data:/pb/pb_data
      - ./pocketbase/pb_migrations:/pb/pb_migrations
      - ./pocketbase/pb_hooks:/pb/pb_hooks
