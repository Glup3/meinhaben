services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8080}
    environment:
      POCKETBASE_URL: ${POCKETBASE_URL:-http://localhost:8090}
      POCKETBASE_INTERNAL_URL: http://pocketbase:8090
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:4321"
    stop_grace_period: 30s

  pocketbase:
    build:
      context: .
      dockerfile: pocketbase/Dockerfile
    restart: unless-stopped
    environment:
      # Coolify parses Compose with a separate build-time environment. Empty
      # defaults let image builds proceed without runtime secrets; entrypoint.sh
      # requires all three values before starting the production server.
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-}
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:-}
    volumes:
      - pocketbase_data:/pb/pb_data
    expose:
      - "8090"
    ports:
      - "127.0.0.1:8090:8090"
    stop_grace_period: 30s

volumes:
  pocketbase_data:
